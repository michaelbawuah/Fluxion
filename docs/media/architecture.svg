   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="39.6" y="38.757656" transform="rotate(-0 39.6 38.757656)">FLUXION</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 31px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142b49" x="39.6" y="76.835156" transform="rotate(-0 39.6 76.835156)">From arrays to a trainable Transformer</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #63758b" x="39.6" y="104.397187" transform="rotate(-0 39.6 104.397187)">The graph and gradients stay in Fluxion. Execution choices are explicit.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #63758b" x="50.4" y="148.157812" transform="rotate(-0 50.4 148.157812)">MODEL &amp; TRAINING</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #63758b" x="601.2" y="148.157812" transform="rotate(-0 601.2 148.157812)">OPERATOR EXECUTION</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="73.44" y="195.877031" transform="rotate(-0 73.44 195.877031)">Modules and GPT</text>
   </g>
   <g id="text_7">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(73.44 219.477656)">Embeddings → causal attention → residual blocks</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(73.44 239.123789)">Final normalization → vocabulary logits</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="73.44" y="311.797031" transform="rotate(-0 73.44 311.797031)">Tensor operations + dynamic DAG</text>
   </g>
   <g id="text_9">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(73.44 335.397656)">NumPy data · parent tensors · local backward rules</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(73.44 355.043789)">Broadcasting, reductions, indexing</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(73.44 374.689922)">and batched matrix multiplication</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="73.44" y="442.837031" transform="rotate(-0 73.44 442.837031)">loss.backward()</text>
   </g>
   <g id="text_11">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(73.44 466.437656)">Seed the output gradient; traverse root → leaves</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(73.44 486.083789)">Accumulate every shared-input gradient contribution</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #078a81" x="73.44" y="576.037031" transform="rotate(-0 73.44 576.037031)">SGD / Adam</text>
   </g>
   <g id="text_13">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #63758b" x="73.44" y="599.637656" transform="rotate(-0 73.44 599.637656)">Read parameter gradients and update NumPy arrays</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #078a81" x="291.6" y="527.557969" transform="rotate(-0 291.6 527.557969)">parameter gradients</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2563eb" x="624.24" y="195.728594" transform="rotate(-0 624.24 195.728594)">NumPy CPU</text>
   </g>
   <g id="text_16">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 219.477656)">Default tensor operations</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 239.123789)">Regular Linear = matmul + bias</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #078a81" x="624.24" y="321.117188" transform="rotate(-0 624.24 321.117188)">NativeLinear · optional CPU</text>
   </g>
   <g id="text_18">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 345.477656)">Fused Linear forward / backward</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 365.123789)">pybind11 extension</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 384.769922)">macOS: Accelerate · Linux: CBLAS</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #966312" x="624.24" y="464.397187" transform="rotate(-0 624.24 464.397187)">cuda_linear · experimental</text>
   </g>
   <g id="text_20">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 488.757656)">Standalone fused Linear operator</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 508.403789)">Custom CUDA forward / backward</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 528.049922)">NumPy → GPU → NumPy each call</text>
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(624.24 547.696055)">Not a device-resident GPT runtime</text>
   </g>
   <g id="text_21">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(586.8 607.517812)">Solid: default / NativeLinear</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #63758b" transform="translate(586.8 625.854203)">Dashed: explicit experimental operator</text>
   </g>
   <g id="text_22">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #63758b" x="39.6" y="686.7975" transform="rotate(-0 39.6 686.7975)">PyTorch is the numerical reference for outputs and gradients; it is outside Fluxion execution.</text>
   </g>
  </g>
 </g>
